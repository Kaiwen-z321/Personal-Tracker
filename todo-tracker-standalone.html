<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>今日待办</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/6.26.0/babel.min.js"></script>
<style>
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#fff;}
.max-w-md{max-width:28rem;}
.mx-auto{margin-left:auto;margin-right:auto;}
.min-h-screen{min-height:100vh;}
.bg-white{background-color:#fff;}
.px-4{padding-left:1rem;padding-right:1rem;}
.px-3{padding-left:0.75rem;padding-right:0.75rem;}
.px-1\.5{padding-left:0.375rem;padding-right:0.375rem;}
.py-0\.5{padding-top:0.125rem;padding-bottom:0.125rem;}
.py-2{padding-top:0.5rem;padding-bottom:0.5rem;}
.py-2\.5{padding-top:0.625rem;padding-bottom:0.625rem;}
.py-3{padding-top:0.75rem;padding-bottom:0.75rem;}
.py-16{padding-top:4rem;padding-bottom:4rem;}
.pt-5{padding-top:1.25rem;}
.pb-3{padding-bottom:0.75rem;}
.pb-6{padding-bottom:1.5rem;}
.p-4{padding:1rem;}
.mt-1{margin-top:0.25rem;}
.mt-0\.5{margin-top:0.125rem;}
.mt-2{margin-top:0.5rem;}
.mt-3{margin-top:0.75rem;}
.mt-5{margin-top:1.25rem;}
.mt-6{margin-top:1.5rem;}
.mb-3{margin-bottom:0.75rem;}
.mb-4{margin-bottom:1rem;}
.flex{display:flex;}
.items-center{align-items:center;}
.items-end{align-items:flex-end;}
.justify-between{justify-content:space-between;}
.justify-center{justify-content:center;}
.gap-1\.5{gap:0.375rem;}
.gap-2{gap:0.5rem;}
.gap-3{gap:0.75rem;}
.gap-4{gap:1rem;}
.flex-1{flex:1 1 0%;}
.shrink-0{flex-shrink:0;}
.min-w-0{min-width:0;}
.w-full{width:100%;}
.w-6{width:1.5rem;}
.h-6{height:1.5rem;}
.w-9{width:2.25rem;}
.h-9{height:2.25rem;}
.rounded{border-radius:0.25rem;}
.rounded-lg{border-radius:0.5rem;}
.rounded-full{border-radius:9999px;}
.rounded-t-2xl{border-top-left-radius:1rem;border-top-right-radius:1rem;}
.border{border-width:1px;border-style:solid;border-color:#e5e7eb;}
.border-2{border-width:2px;border-style:solid;}
.border-b{border-bottom:1px solid #f3f4f6;}
.border-b-2{border-bottom-width:2px;border-bottom-style:solid;}
.border-transparent{border-color:transparent;}
.border-gray-100{border-color:#f3f4f6;}
.border-gray-200{border-color:#e5e7eb;}
.border-gray-300{border-color:#d1d5db;}
.border-gray-900{border-color:#111827;}
.border-red-100{border-color:#fee2e2;}
.border-blue-200{border-color:#bfdbfe;}
.border-orange-200{border-color:#fed7aa;}
.border-green-200{border-color:#bbf7d0;}
.border-purple-200{border-color:#e9d5ff;}
.text-white{color:#fff;}
.text-gray-400{color:#9ca3af;}
.text-gray-500{color:#6b7280;}
.text-gray-800{color:#1f2937;}
.text-gray-900{color:#111827;}
.text-red-600{color:#dc2626;}
.text-blue-700{color:#1d4ed8;}
.text-orange-700{color:#c2410c;}
.text-green-700{color:#15803d;}
.text-purple-700{color:#7e22ce;}
.bg-gray-50{background-color:#f9fafb;}
.bg-gray-100{background-color:#f3f4f6;}
.bg-gray-900{background-color:#111827;}
.bg-red-50{background-color:#fef2f2;}
.bg-blue-50{background-color:#eff6ff;}
.bg-orange-50{background-color:#fff7ed;}
.bg-green-50{background-color:#f0fdf4;}
.bg-purple-50{background-color:#faf5ff;}
.text-xs{font-size:0.75rem;line-height:1rem;}
.text-sm{font-size:0.875rem;line-height:1.25rem;}
.text-base{font-size:1rem;line-height:1.5rem;}
.text-lg{font-size:1.125rem;line-height:1.75rem;}
.text-xl{font-size:1.25rem;line-height:1.75rem;}
.font-medium{font-weight:500;}
.font-semibold{font-weight:600;}
.text-center{text-align:center;}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.underline{text-decoration:underline;}
.line-through{text-decoration:line-through;}
.leading-none{line-height:1;}
.space-y-2>*+*{margin-top:0.5rem;}
.fixed{position:fixed;}
.inset-0{top:0;right:0;bottom:0;left:0;}
.z-50{z-index:50;}
.overflow-y-auto{overflow-y:auto;}
.transition-transform{transition:transform .15s ease;}
button{font-family:inherit;cursor:pointer;background:none;border:none;padding:0;color:inherit;}
input{font-family:inherit;}
.active\:scale-95:active{transform:scale(0.95);}
.active\:bg-gray-50:active{background-color:#f9fafb;}
.active\:border-gray-900:active{border-color:#111827;}
.focus\:outline-none:focus{outline:none;}
.focus\:ring-2:focus{box-shadow:0 0 0 2px #111827;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const CATS = [
  { key: 'temp', label: '临时', color: 'blue' },
  { key: 'interval', label: '间隔', color: 'orange' },
  { key: 'fixed', label: '固定', color: 'green' },
  { key: 'freq', label: '频次', color: 'purple' },
];
const COLOR_CLASSES = {
  blue: 'bg-blue-50 text-blue-700 border-blue-200',
  orange: 'bg-orange-50 text-orange-700 border-orange-200',
  green: 'bg-green-50 text-green-700 border-green-200',
  purple: 'bg-purple-50 text-purple-700 border-purple-200',
};
const WEEKDAY_LABELS = ['日', '一', '二', '三', '四', '五', '六'];
const STORAGE_KEY = 'kevin-todo-tracker-data';

function pad(n) { return String(n).padStart(2, '0'); }
function formatDate(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function todayStr() { return formatDate(new Date()); }
function daysBetween(a, b) {
  const d1 = new Date(a + 'T00:00:00');
  const d2 = new Date(b + 'T00:00:00');
  return Math.round((d2 - d1) / 86400000);
}
function getWeekStart(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const day = d.getDay();
  const diff = day === 0 ? 6 : day - 1;
  d.setDate(d.getDate() - diff);
  return formatDate(d);
}
function emptyForm() {
  return { id: null, name: '', category: 'temp', dueDate: todayStr(), intervalDays: 3, weekdays: [], timesPerWeek: 3 };
}
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { tasks: [], completions: [] };
}
function saveData(next) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
    return true;
  } catch (e) {
    return false;
  }
}

function TodoTracker() {
  const [data, setData] = useState(loadData);
  const [saveError, setSaveError] = useState(false);
  const [view, setView] = useState('today');
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState(emptyForm());
  const [showCompleted, setShowCompleted] = useState(false);

  function persist(next) {
    setData(next);
    setSaveError(!saveData(next));
  }

  const today = todayStr();
  const todayWeekday = new Date().getDay();
  const weekStart = getWeekStart(today);

  function hasCompletionToday(taskId) {
    return data.completions.some(c => c.taskId === taskId && c.date === today);
  }
  function weekCount(taskId) {
    return data.completions.filter(c => c.taskId === taskId && c.date >= weekStart && c.date <= today).length;
  }
  function isDueToday(task) {
    if (task.category === 'temp') return !task.archived && task.dueDate <= today;
    if (task.category === 'interval') return !task.lastDone || daysBetween(task.lastDone, today) >= task.intervalDays;
    if (task.category === 'fixed') return task.weekdays.includes(todayWeekday) && !hasCompletionToday(task.id);
    if (task.category === 'freq') return weekCount(task.id) < task.timesPerWeek;
    return false;
  }
  function isCompletedToday(task) {
    if (task.category === 'temp') return task.archived && task.archivedDate === today;
    if (task.category === 'interval') return task.lastDone === today;
    return hasCompletionToday(task.id);
  }

  const dueTasks = data.tasks.filter(isDueToday);
  const completedTodayTasks = data.tasks.filter(isCompletedToday);

  function markDone(task) {
    const next = { tasks: [...data.tasks], completions: [...data.completions] };
    const idx = next.tasks.findIndex(t => t.id === task.id);
    if (task.category === 'temp') next.tasks[idx] = { ...task, archived: true, archivedDate: today };
    else if (task.category === 'interval') next.tasks[idx] = { ...task, lastDone: today };
    else next.completions.push({ taskId: task.id, date: today });
    persist(next);
  }
  function undo(task) {
    const next = { tasks: [...data.tasks], completions: [...data.completions] };
    const idx = next.tasks.findIndex(t => t.id === task.id);
    if (task.category === 'temp') next.tasks[idx] = { ...task, archived: false, archivedDate: null };
    else if (task.category === 'interval') next.tasks[idx] = { ...task, lastDone: null };
    else next.completions = next.completions.filter(c => !(c.taskId === task.id && c.date === today));
    persist(next);
  }
  function deleteTask(taskId) {
    persist({
      tasks: data.tasks.filter(t => t.id !== taskId),
      completions: data.completions.filter(c => c.taskId !== taskId),
    });
  }
  function openAddForm() { setForm(emptyForm()); setShowForm(true); }
  function openEditForm(task) {
    setForm({
      id: task.id, name: task.name, category: task.category,
      dueDate: task.dueDate || todayStr(), intervalDays: task.intervalDays || 3,
      weekdays: task.weekdays || [], timesPerWeek: task.timesPerWeek || 3,
    });
    setShowForm(true);
  }
  function saveForm() {
    if (!form.name.trim()) return;
    const next = { tasks: [...data.tasks], completions: data.completions };
    if (form.id) {
      const idx = next.tasks.findIndex(t => t.id === form.id);
      next.tasks[idx] = {
        ...next.tasks[idx], name: form.name.trim(), category: form.category, dueDate: form.dueDate,
        intervalDays: Number(form.intervalDays) || 1, weekdays: form.weekdays, timesPerWeek: Number(form.timesPerWeek) || 1,
      };
    } else {
      next.tasks.push({
        id: 'task_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
        name: form.name.trim(), category: form.category, dueDate: form.dueDate,
        intervalDays: Number(form.intervalDays) || 1, lastDone: null,
        weekdays: form.weekdays, timesPerWeek: Number(form.timesPerWeek) || 1,
        archived: false, archivedDate: null,
      });
    }
    persist(next);
    setShowForm(false);
  }
  function toggleWeekday(d) {
    setForm(f => ({ ...f, weekdays: f.weekdays.includes(d) ? f.weekdays.filter(x => x !== d) : [...f.weekdays, d].sort() }));
  }

  const catInfo = key => CATS.find(c => c.key === key);

  return (
    <div className="max-w-md mx-auto bg-white min-h-screen">
      <div className="px-4 pt-5 pb-3 border-b border-gray-100">
        <div className="flex items-center justify-between">
          <h1 className="text-lg font-semibold text-gray-900">{view === 'today' ? '今日待办' : '全部任务'}</h1>
          <button onClick={openAddForm} className="w-9 h-9 rounded-full bg-gray-900 text-white text-xl leading-none active:scale-95 transition-transform">+</button>
        </div>
        <div className="flex gap-4 mt-3">
          <button onClick={() => setView('today')} className={`text-sm pb-2 border-b-2 ${view === 'today' ? 'border-gray-900 text-gray-900 font-medium' : 'border-transparent text-gray-400'}`}>今日</button>
          <button onClick={() => setView('all')} className={`text-sm pb-2 border-b-2 ${view === 'all' ? 'border-gray-900 text-gray-900 font-medium' : 'border-transparent text-gray-400'}`}>全部</button>
        </div>
      </div>

      {saveError && (
        <div className="mx-4 mt-3 text-xs text-red-600 bg-red-50 border border-red-100 rounded px-3 py-2">保存失败(可能是隐私浏览模式),刚才的改动可能没存上</div>
      )}

      {view === 'today' ? (
        <div className="px-4 py-3">
          {dueTasks.length === 0 && completedTodayTasks.length === 0 && (
            <div className="text-center text-gray-400 text-sm py-16">今天没有待办事项</div>
          )}
          <div className="space-y-2">
            {dueTasks.map(task => (
              <div key={task.id} className="flex items-center gap-3 px-3 py-3 rounded-lg border border-gray-100 bg-white active:bg-gray-50">
                <button onClick={() => markDone(task)} className="w-6 h-6 rounded-full border-2 border-gray-300 shrink-0 active:border-gray-900"></button>
                <div className="flex-1 min-w-0">
                  <div className="text-sm text-gray-900">{task.name}</div>
                  <div className="text-xs text-gray-400 mt-0.5">
                    {task.category === 'freq' && `${weekCount(task.id)}/${task.timesPerWeek} 本周`}
                    {task.category === 'interval' && `每${task.intervalDays}天`}
                    {task.category === 'fixed' && task.weekdays.map(d => WEEKDAY_LABELS[d]).join('、')}
                  </div>
                </div>
                <span className={`text-xs px-1.5 py-0.5 rounded shrink-0 border ${COLOR_CLASSES[catInfo(task.category).color]}`}>{catInfo(task.category).label}</span>
              </div>
            ))}
          </div>

          {completedTodayTasks.length > 0 && (
            <div className="mt-6">
              <button onClick={() => setShowCompleted(s => !s)} className="text-xs text-gray-400">
                今天已完成 ({completedTodayTasks.length}) {showCompleted ? '▴' : '▾'}
              </button>
              {showCompleted && (
                <div className="space-y-2 mt-2">
                  {completedTodayTasks.map(task => (
                    <div key={task.id} className="flex items-center justify-between px-3 py-2 bg-gray-50 rounded-lg">
                      <span className="text-sm text-gray-400 line-through">{task.name}</span>
                      <button onClick={() => undo(task)} className="text-xs text-gray-400 underline">撤销</button>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
        </div>
      ) : (
        <div className="px-4 py-3 space-y-2">
          {data.tasks.filter(t => !(t.category === 'temp' && t.archived)).length === 0 && (
            <div className="text-center text-gray-400 text-sm py-16">还没有任务,点右上角 + 添加</div>
          )}
          {data.tasks.filter(t => !(t.category === 'temp' && t.archived)).map(task => {
            const info = catInfo(task.category);
            return (
              <div key={task.id} className={`flex items-center justify-between px-3 py-2.5 rounded-lg border ${COLOR_CLASSES[info.color]}`}>
                <div className="flex items-center gap-2 min-w-0">
                  <span className="text-xs px-1.5 py-0.5 rounded bg-white shrink-0">{info.label}</span>
                  <span className="text-sm text-gray-800 truncate">{task.name}</span>
                </div>
                <div className="flex items-center gap-2 shrink-0 text-xs">
                  <button onClick={() => openEditForm(task)} className="text-gray-500 underline">编辑</button>
                  <button onClick={() => deleteTask(task.id)} className="text-gray-400 underline">删除</button>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {showForm && (
        <div className="fixed inset-0 flex items-end justify-center z-50" style={{ backgroundColor: 'rgba(0,0,0,0.3)' }} onClick={() => setShowForm(false)}>
          <div className="bg-white w-full max-w-md rounded-t-2xl p-4 pb-6 overflow-y-auto" style={{ maxHeight: '85vh' }} onClick={e => e.stopPropagation()}>
            <div className="flex items-center justify-between mb-4">
              <h2 className="text-base font-semibold text-gray-900">{form.id ? '编辑任务' : '新任务'}</h2>
              <button onClick={() => setShowForm(false)} className="text-gray-400 text-xl leading-none">×</button>
            </div>

            <input type="text" placeholder="任务名称" value={form.name} onChange={e => setForm(f => ({ ...f, name: e.target.value }))}
              className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm mb-3 focus:outline-none focus:ring-2 focus:ring-gray-900" />

            <div className="flex gap-2 mb-4">
              {CATS.map(c => (
                <button key={c.key} onClick={() => setForm(f => ({ ...f, category: c.key }))}
                  className={`flex-1 text-sm py-2 rounded-lg border ${form.category === c.key ? COLOR_CLASSES[c.color] + ' border-2' : 'border-gray-200 text-gray-400'}`}>
                  {c.label}
                </button>
              ))}
            </div>

            {form.category === 'temp' && (
              <div>
                <label className="text-xs text-gray-500">日期</label>
                <input type="date" value={form.dueDate} onChange={e => setForm(f => ({ ...f, dueDate: e.target.value }))}
                  className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm mt-1" />
              </div>
            )}
            {form.category === 'interval' && (
              <div>
                <label className="text-xs text-gray-500">完成后隔几天再提醒</label>
                <input type="number" min="1" value={form.intervalDays} onChange={e => setForm(f => ({ ...f, intervalDays: e.target.value }))}
                  className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm mt-1" />
              </div>
            )}
            {form.category === 'fixed' && (
              <div>
                <label className="text-xs text-gray-500">选择星期几</label>
                <div className="flex gap-1.5 mt-1">
                  {WEEKDAY_LABELS.map((label, idx) => (
                    <button key={idx} onClick={() => toggleWeekday(idx)}
                      className={`w-9 h-9 rounded-full text-sm ${form.weekdays.includes(idx) ? 'bg-gray-900 text-white' : 'bg-gray-100 text-gray-500'}`}>
                      {label}
                    </button>
                  ))}
                </div>
              </div>
            )}
            {form.category === 'freq' && (
              <div>
                <label className="text-xs text-gray-500">每周做几次</label>
                <input type="number" min="1" max="7" value={form.timesPerWeek} onChange={e => setForm(f => ({ ...f, timesPerWeek: e.target.value }))}
                  className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm mt-1" />
              </div>
            )}

            <button onClick={saveForm} className="w-full bg-gray-900 text-white rounded-lg py-2.5 text-sm font-medium mt-5">保存</button>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<TodoTracker />);
</script>
</body>
</html>
